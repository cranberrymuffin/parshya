    title: Breaking the scarcity vow
    description: Names the habit of nonprofit leaders quietly accepting less, shows how it hits women and leaders of color hardest, and ends with what leaders, boards, and funders can do about it.
    image: "/img/scarcity-vow-carousel.jpg"
    image_alt: 'First slide of the scarcity vow carousel: Are you asking for less than you deserve?'
