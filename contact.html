<title>Contact · Parshya Kavoosi</title>
<meta name="description" content="Get in touch with Parshya Kavoosi, a digital communications and marketing manager who turns complex topics into stories people want to read.">
<link rel="canonical" href="https://parshyakavoosi.com/contact.html">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body class="fit">
<canvas id="bg" aria-hidden="true"></canvas>

<nav>
  <div class="wrap">
    <a class="logo" href="./" aria-label="Parshya Kavoosi"><span>Parshya</span> <span>Kavoosi</span></a>
    <ul>
      <li><a href="./">Home</a></li>
      <li><a href="resume.html">Resume</a></li>
      <li><a href="portfolio.html">Portfolio</a></li>
      <li><a href="contact.html" aria-current="page">Contact</a></li>
    </ul>
  </div>
</nav>

<main>
{%- assign contact = site.data.contact %}
<section class="contact page" id="contact">
  <div class="wrap">
    <p class="label">Contact</p>
    <h1>{{ contact.heading | escape }}</h1>
    <p>{{ contact.text | escape }}</p>
    <div class="cta">
      <a class="btn primary" href="mailto:{{ contact.email }}">Email me</a>
      <a class="btn" href="{{ contact.linkedin }}" target="_blank" rel="noopener">LinkedIn ↗</a>
    </div>
  </div>
</section>
</main>

<footer class="wrap">© 2026 Parshya Kavoosi</footer>

<script type="module" src="bg.js"></script>
</body>
</html>
